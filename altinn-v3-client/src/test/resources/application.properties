## Testkonfigurasjon for altinn-v3-client.
##
## Fila blir lasta oppå integrasjonspunkt/src/main/resources/config/application.properties
## av @UseFullTestConfiguration, og blir berre brukt av dei manuelle testane (@Disabled) mot TT02.
##
## Legg ikkje inn org-spesifikk konfigurasjon (orgnr, clientId, keystore, systembrukar) her.
## Set det som miljøvariablar når du køyrer testen, t.d. DIFI_MOVE_ORG_NUMBER, DIFI_MOVE_DPO_OIDC_CLIENTID,
## DIFI_MOVE_DPO_OIDC_AUTHENTICATIONTYPE og DIFI_MOVE_DPO_OIDC_JWK_PATH (ev. DIFI_MOVE_ORG_KEYSTORE_*).
## Bruk miljøvariablar, ikkje -D: systemproperties blir ikkje plukka opp for nøklane under.
##
## Verdiar frå @TestPropertySource vinn over miljøvariablar. Nøklar som har ein verdi i
## hovudkonfigurasjonen må derfor slå opp miljøvariabelen eksplisitt, slik som under.

## Service toggles
difi.move.feature.enableDPO=true
difi.move.feature.enableDPV=true

## DPO (Altinn v3 broker): URL-ar og ressurs har TT02-verdiar i hovudkonfigurasjonen
difi.move.dpo.oidc.clientId=${DIFI_MOVE_DPO_OIDC_CLIENTID:${difi.move.oidc.clientId}}
difi.move.dpo.systemUser.orgId=${DIFI_MOVE_DPO_SYSTEMUSER_ORGID:0192:${difi.move.org.number}}
difi.move.dpo.systemUser.name=${DIFI_MOVE_DPO_SYSTEMUSER_NAME:${difi.move.org.number}_integrasjonspunkt_systembruker_${difi.move.org.number}}

## DPV (Altinn v3 correspondence)
difi.move.dpv.correspondenceServiceUrl=${DIFI_MOVE_DPV_CORRESPONDENCESERVICEURL:https://test.eformidling.no/altinn-proxy/correspondence/api/v1}
difi.move.dpv.oidc.clientId=${DIFI_MOVE_DPV_OIDC_CLIENTID:${difi.move.oidc.clientId}}
difi.move.dpv.email-subject="email resource"
