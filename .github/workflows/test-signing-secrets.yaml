name: Test signing secrets

# Verifiser og feilsøk kodesigneringsnøkkelen for eFormidling, utan å lage ein release.
#
# Sjekkar at org-secrets EFM_GPG_PRIVATE_KEY og EFM_GPG_PASSPHRASE er gyldige:
#   1. Nøkkelen i secret har rett fingeravtrykk, og viser utløpsdatoen hans
#   2. Passordet er rett (signerer ei testfil)
#   3. Signaturen verifiserer mot den publiserte nøkkelen på docs.digdir.no,
#      på same måte som release-workflowen (call-release.yaml)
# Berre offentleg informasjon blir skriven til loggen (fingeravtrykk, uid, utløpsdato).
#
# Når skal han brukast:
#   - Etter at nøkkelen er forlenga med extend.sh og secrets er oppdaterte
#   - Etter at EFM_GPG_PRIVATE_KEY eller EFM_GPG_PASSPHRASE er endra
#   - Når signeringa i release-workflowen feilar
#
# Køyrast berre manuelt (workflow_dispatch). Fila må liggje på main for at han skal kunne startast.
#
# Frå GitHub web:
#   Actions -> "Test signing secrets" -> "Run workflow" -> vel branch -> "Run workflow"
#
# Frå GitHub CLI (frå repo-katalogen):
#   gh workflow run test-signing-secrets.yaml                   # køyr på main
#   gh workflow run test-signing-secrets.yaml --ref <branch>    # køyr versjonen på ein annan branch
#   gh run watch $(gh run list --workflow test-signing-secrets.yaml -L1 --json databaseId --jq '.[0].databaseId')
#   gh run view --log-failed                                    # vis loggen frå steget som feila
#
# Køyre på nytt etter at secrets er oppdaterte (les inn nye secret-verdiar):
#   gh run rerun <run-id>
#
# Typiske feil:
#   - "invalid armor header": tom linje etter BEGIN-linja manglar i secret.
#     Set secret frå fil i staden for å lime inn: gh secret set ... < nøkkelfil
#   - "[expired: ...]" + "Unusable secret key": secret inneheld ein gammal eksport
#     av nøkkelen. Oppdater med den forlenga private nøkkelen frå extend.sh
#   - "Signering feila" utan utgått nøkkel: feil passord i EFM_GPG_PASSPHRASE
#   - "Signaturen er ikkje gyldig mot publisert nøkkel": publisert nøkkel på
#     docs.digdir.no er utgått eller ikkje oppdatert etter forlenging
on:
  workflow_dispatch:

permissions: {}

jobs:
  test-signing-secrets:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_FINGERPRINT: AEF27AA6948A3856932AF98ECA5643393753ECE3
      PUBLIC_KEY_URL: https://docs.digdir.no/resources/eformidling/public_keys/eformidling-key.asc
    steps:
      - name: Inspect key, test passphrase and verify signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.EFM_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.EFM_GPG_PASSPHRASE }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::EFM_GPG_PRIVATE_KEY is empty or not available to this repo"; exit 1; }
          [ -n "$GPG_PASSPHRASE" ] || { echo "::error::EFM_GPG_PASSPHRASE is empty or not available to this repo"; exit 1; }

          set -o pipefail
          SIGN_HOME=$(mktemp -d)
          VERIFY_HOME=$(mktemp -d)
          chmod 700 "$SIGN_HOME" "$VERIFY_HOME"
          trap 'rm -rf "$SIGN_HOME" "$VERIFY_HOME"' EXIT
          export GNUPGHOME="$SIGN_HOME"

          echo "### 1. Nøkkelen i secret (kun offentleg info: fingeravtrykk, uid, utløpsdato)"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG --with-fingerprint

          if ! gpg --list-secret-keys --with-colons | grep -q "^fpr:::::::::$SIGNING_KEY_FINGERPRINT:"; then
            echo "::error::Secret inneheld ikkje nøkkelen $SIGNING_KEY_FINGERPRINT"
            exit 1
          fi
          EXPIRES=$(gpg --list-secret-keys --with-colons "$SIGNING_KEY_FINGERPRINT" | awk -F: '$1=="sec"{print $7; exit}')
          if [ -n "$EXPIRES" ]; then
            echo "Utløpsdato i secret: $(date -u -d "@$EXPIRES" +%F) ($EXPIRES)"
          else
            echo "Utløpsdato i secret: aldri"
          fi

          echo "### 2. Test passord ved å signere ei testfil"
          echo "test $(date -u)" > test.txt
          if ! gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                 --local-user "$SIGNING_KEY_FINGERPRINT" --detach-sign --armor test.txt; then
            echo "::error::Signering feila: feil passord, eller nøkkelen i secret er utgått"
            exit 1
          fi
          echo "Passordet er rett"

          echo "### 3. Verifiser mot publisert nøkkel (som i release-workflowen)"
          export GNUPGHOME="$VERIFY_HOME"
          curl --fail --silent --show-error --location -o eformidling-key.asc "$PUBLIC_KEY_URL"
          gpg --batch --import eformidling-key.asc
          gpg --batch --status-fd 1 --verify test.txt.asc test.txt | tee verify.out
          grep -q "^\[GNUPG:\] GOODSIG " verify.out || { echo "::error::Signaturen er ikkje gyldig mot publisert nøkkel"; exit 1; }
          ACTUAL=$(awk '$2 == "VALIDSIG" {print $3}' verify.out)
          [ "$ACTUAL" = "$SIGNING_KEY_FINGERPRINT" ] || { echo "::error::Feil fingeravtrykk: '$ACTUAL'"; exit 1; }
          echo "✅ Secrets er gyldige: rett nøkkel, rett passord, og signaturen verifiserer mot publisert nøkkel"
